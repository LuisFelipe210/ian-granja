project_id = "ian-granja"

[auth]
enabled = true
site_url = "https://www.iangranja.adv.br/ferramentas/calculadora-revisional"
additional_redirect_urls = [
  "https://www.iangranja.adv.br/ferramentas/calculadora-revisional",
  "https://www.iangranja.adv.br/**",
  "http://localhost:8080/ferramentas/calculadora-revisional",
  "http://localhost:8080/**",
  "http://localhost:8081/ferramentas/calculadora-revisional",
  "http://localhost:8081/**"
]
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
